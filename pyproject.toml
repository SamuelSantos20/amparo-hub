[project]
name = "call-data-etl-pipeline"
version = "0.1.0"
description = "Pipeline demonstrativo para extrair dados de chamadas de uma API e carregá-los no PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.9,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "requests>=2.31.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
